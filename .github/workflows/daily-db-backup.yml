name: Daily Supabase DB Backup

on:
  schedule:
    # Run daily at 18:00 JST (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Supabase CLI as dev dependency
        run: npm i supabase --save-dev
        working-directory: ./backend

      - name: Create backup directory
        run: mkdir -p ./backup

      - name: Run backup
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          npx supabase db dump --db-url ${{ secrets.DATABASE_URL }} -f ./backup/backup-$TIMESTAMP.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: ./backup/backup-*.sql
          retention-days: 7 # Keep backups for 7 days
