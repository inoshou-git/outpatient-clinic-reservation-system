name: Daily Supabase DB Backup

on:
  schedule:
    # Run daily at 18:00 JST (09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          set -e
          curl -fsSL https://get.supabase.com/install.sh | sh
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      - name: Verify Supabase CLI installation
        run: |
          ls -la $HOME/.supabase/bin
          supabase --version

      - name: Debug PATH
        run: echo $PATH

      - name: Create backup directory
        run: mkdir -p ./backup

      - name: Run backup
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          supabase db dump -f ./backup/backup-$TIMESTAMP.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: ./backup/backup-*.sql
          retention-days: 7 # Keep backups for 7 days
